<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Karma Quest: Anime Boss Edition</title>
    <style>
        :root { --cyan: #00ffff; --gold: #ffd700; --red: #ff3333; --purple: #a200ff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; touch-action: none; user-select: none; }

        /* --- UI REWRITE: PREVENTING OVERLAPS --- */
        #game-hud {
            position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 100;
        }

        /* Side Cards (Player Stats) */
        .stat-box {
            background: rgba(0, 0, 0, 0.85); border: 2px solid var(--cyan);
            padding: 8px; border-radius: 8px; width: 25vw; max-width: 140px;
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .stat-title { font-size: 10px; font-weight: bold; margin-bottom: 4px; }
        .bar-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
        .bar-fill { height: 100%; transition: width 0.2s ease; }

        /* Center Boss Area */
        #center-ui { text-align: center; flex-grow: 1; margin: 0 10px; }
        #boss-title { margin: 0; font-size: clamp(16px, 4vw, 24px); color: var(--gold); text-shadow: 0 0 5px #000; text-transform: uppercase; }
        #weather-txt { margin: 2px 0 8px 0; font-size: 9px; color: #ccc; letter-spacing: 1px; }
        
        #boss-hp-container {
            width: 100%; max-width: 300px; margin: 0 auto; background: rgba(0,0,0,0.8);
            border: 2px solid var(--purple); padding: 4px; border-radius: 6px; display: none;
        }

        /* --- CONTROLS: SHRUNK TO AVOID BLOCKING VISION --- */
        .ctrl-area { position: absolute; bottom: 20px; pointer-events: auto; }
        
        #joy-zone { left: 20px; width: 100px; height: 100px; background: rgba(255,255,255,0.05); border: 2px solid rgba(0,255,255,0.4); border-radius: 50%; }
        #joy-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 15px var(--cyan); }

        #action-zone { right: 20px; display: flex; gap: 15px; align-items: flex-end; }
        .act-btn {
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; background: rgba(0,0,0,0.7); border: 2px solid var(--gold);
        }
        #btn-dash { width: 60px; height: 60px; font-size: 11px; }
        #btn-atk { width: 85px; height: 85px; font-size: 14px; border-color: var(--red); color: var(--red); }
        .act-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        /* Overlays */
        #dmg-flash { position: fixed; inset: 0; background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 50; }
    </style>
</head>
<body>

<div id="game-hud">
    <div class="stat-box">
        <div class="stat-title" style="color:var(--red);">HP VITALITY</div>
        <div class="bar-bg"><div id="bar-hp" class="bar-fill" style="background:var(--red); width:100%;"></div></div>
    </div>
    
    <div id="center-ui">
        <h1 id="boss-title">LOADING...</h1>
        <p id="weather-txt">WEATHER: CLEAR</p>
        <div id="boss-hp-container">
            <div class="stat-title" style="color:var(--purple); text-align:left;">ANIME BOSS HP</div>
            <div class="bar-bg" style="height:12px;"><div id="bar-boss" class="bar-fill" style="background:var(--purple); width:100%;"></div></div>
        </div>
    </div>

    <div class="stat-box" style="text-align:right;">
        <div class="stat-title" style="color:var(--cyan);">KARMA <span id="txt-karma">0</span>/10</div>
        <div class="bar-bg"><div id="bar-karma" class="bar-fill" style="background:var(--cyan); width:0%;"></div></div>
    </div>
</div>

<div id="dmg-flash"></div>

<div class="ctrl-area" id="joy-zone"><div id="joy-knob"></div></div>
<div class="ctrl-area" id="action-zone">
    <div class="act-btn" id="btn-dash">DASH</div>
    <div class="act-btn" id="btn-atk">STRIKE</div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';

// ==========================================
// 1. GAME CONFIG & DATA
// ==========================================
const LEVELS = [
    { name: "The Grunt", grid: 0xaa5500, sky: 0xffccaa, aura: 0xff0000, projSpeed: 0.1, atkRate: 150 },
    { name: "Sand Ninja", grid: 0xcc8800, sky: 0xffaa55, aura: 0xff6600, projSpeed: 0.15, atkRate: 130 },
    { name: "Toxic Sage", grid: 0x005500, sky: 0x224422, aura: 0x00ff00, projSpeed: 0.15, atkRate: 110 },
    { name: "Stone Golem", grid: 0x333333, sky: 0x555555, aura: 0x888888, projSpeed: 0.2, atkRate: 100 },
    { name: "Void Walker", grid: 0x220044, sky: 0x110022, aura: 0xa200ff, projSpeed: 0.2, atkRate: 90 },
    { name: "Acid Fiend", grid: 0x335500, sky: 0x112200, aura: 0x88ff00, projSpeed: 0.25, atkRate: 80 },
    { name: "Ice Monarch", grid: 0x004488, sky: 0xaaeeff, aura: 0x00ffff, projSpeed: 0.25, atkRate: 70 },
    { name: "Thunder God", grid: 0x444400, sky: 0x111111, aura: 0xffff00, projSpeed: 0.3, atkRate: 60 },
    { name: "Storm Demon", grid: 0x110000, sky: 0x000000, aura: 0xff3333, projSpeed: 0.35, atkRate: 50 },
    { name: "ASTRAEUS", grid: 0x550055, sky: 0x000000, aura: 0xffffff, projSpeed: 0.4, atkRate: 40 } // The God
];

let state = { hp: 100, karma: 0, level: 1, moveX: 0, moveZ: 0, isDashing: false };
let scene, camera, renderer, clock;
let hero, boss, groundMat, groundMesh;
let enemies = [], projectiles = [], auras = [];

// ==========================================
// 2. PROCEDURAL TEXTURE GENERATOR (SOLID GROUND)
// ==========================================
// This fixes the "depth perception" issue by drawing a real grid on a canvas.
function createGridTexture(lineColorHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Background (Darker shade of the line color)
    ctx.fillStyle = '#' + (lineColorHex - 0x222222).toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, 512, 512);
    
    // Grid Lines
    ctx.strokeStyle = '#' + lineColorHex.toString(16).padStart(6, '0');
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, 512, 512);
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(50, 50); // Tiles the grid 50 times across the floor
    return tex;
}

// ==========================================
// 3. ENGINE INITIALIZATION
// ==========================================
function init() {
    scene = new THREE.Scene();
    
    // Adjusted Camera: Closer and lower to see the hero properly
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    clock = new THREE.Clock();

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(20, 50, 20);
    scene.add(sun);

    // Initial Ground Setup
    groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    scene.add(groundMesh);

    // Hero Setup (Black Capsule with Cyan Anime Sword)
    hero = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 1.2), new THREE.MeshStandardMaterial({color: 0x111111}));
    const sword = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 3), new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00ffff}));
    sword.position.set(0.8, 0.2, -1);
    sword.name = "blade";
    hero.add(body, sword);
    hero.position.y = 1.2;
    scene.add(hero);

    setupControls();
    buildLevel(1);
    animate();
}

// ==========================================
// 4. LEVEL & ANIME BOSS BUILDER
// ==========================================
function buildLevel(lv) {
    state.level = lv;
    const cfg = LEVELS[lv - 1];

    // Update UI
    document.getElementById("boss-title").innerText = `LVL ${lv}: ${cfg.name}`;
    document.getElementById("txt-karma").innerText = lv - 1;
    document.getElementById("bar-karma").style.width = ((lv-1)*10) + "%";
    document.getElementById("boss-hp-container").style.display = "block";
    document.getElementById("bar-boss").style.width = "100%";

    // Apply Procedural Solid Ground & Environment
    scene.background = new THREE.Color(cfg.sky);
    scene.fog = new THREE.Fog(cfg.sky, 15, 80);
    groundMat.map = createGridTexture(cfg.grid);
    groundMat.needsUpdate = true;

    // Clear old entities
    enemies.forEach(e => scene.remove(e)); enemies = [];
    projectiles.forEach(p => scene.remove(p)); projectiles = [];
    auras.forEach(a => scene.remove(a)); auras = [];

    // Build Anime Boss
    if (boss) scene.remove(boss);
    boss = new THREE.Group();
    
    // Boss Body
    const bSize = lv === 10 ? 6 : 3; // Astraeus is huge
    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bSize, bSize*1.5, bSize), new THREE.MeshStandardMaterial({color: 0x000, emissive: cfg.aura, emissiveIntensity: 0.5}));
    bMesh.position.y = bSize * 0.75;
    boss.add(bMesh);

    // Anime Floating Aura Rings
    const ringGeo = new THREE.TorusGeometry(bSize*1.2, 0.2, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({color: cfg.aura, wireframe: true});
    for(let i=0; i<3; i++) {
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.random() * Math.PI;
        ring.rotation.y = Math.random() * Math.PI;
        auras.push({ mesh: ring, speed: (Math.random() - 0.5) * 0.1 });
        boss.add(ring);
    }

    boss.position.set(0, 0, -40);
    boss.userData = { hp: 300 + (lv*150), max: 300 + (lv*150), timer: 0, cfg: cfg };
    scene.add(boss);

    // Spawn Minions
    const eCount = lv === 10 ? 12 : 3 + lv;
    for(let i=0; i<eCount; i++) {
        const en = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshStandardMaterial({color: 0xff0000}));
        en.position.set((Math.random() - 0.5) * 60, 0.8, -20 - Math.random() * 30);
        en.userData = { hp: 50+(lv*20), spd: 0.05 + (lv*0.01) };
        scene.add(en);
        enemies.push(en);
    }
}

// ==========================================
// 5. INPUT CONTROLLER (FIXED HITBOXES)
// ==========================================
function setupControls() {
    const joyBase = document.getElementById("joy-zone");
    const joyKnob = document.getElementById("joy-knob");

    joyBase.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const r = joyBase.getBoundingClientRect();
        const dx = e.touches[0].clientX - (r.left + r.width/2);
        const dy = e.touches[0].clientY - (r.top + r.height/2);
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 30); // Max pull distance
        const ang = Math.atan2(dy, dx);
        
        state.moveX = Math.cos(ang) * (dist/30);
        state.moveZ = Math.sin(ang) * (dist/30);
        joyKnob.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
    }, {passive: false});

    joyBase.addEventListener("touchend", () => {
        state.moveX = 0; state.moveZ = 0;
        joyKnob.style.transform = "none";
    });

    // Strike Logic
    document.getElementById("btn-atk").addEventListener("touchstart", (e) => {
        e.preventDefault();
        const blade = hero.getObjectByName("blade");
        blade.scale.set(5, 1, 5); // Massive sword sweep
        
        const hitBox = new THREE.Box3().setFromObject(blade);
        
        // Damage Minions
        enemies.forEach(en => { if(hitBox.intersectsBox(new THREE.Box3().setFromObject(en))) en.userData.hp -= 60; });
        
        // Damage Boss (Only if minions are dead on Level 10)
        if(boss) {
            if(state.level < 10 || enemies.length === 0) {
                if(hitBox.intersectsBox(new THREE.Box3().setFromObject(boss))) {
                    boss.userData.hp -= 40;
                    document.getElementById("bar-boss").style.width = Math.max(0, (boss.userData.hp / boss.userData.max)*100) + "%";
                }
            }
        }
        setTimeout(() => blade.scale.set(1, 1, 1), 150);
    });

    document.getElementById("btn-dash").addEventListener("touchstart", (e) => {
        e.preventDefault(); state.isDashing = true; setTimeout(() => state.isDashing = false, 600);
    });
}

function takeDamage(amt) {
    if(state.isDashing) return; // I-frames during dash
    state.hp -= amt;
    document.getElementById("bar-hp").style.width = Math.max(0, state.hp) + "%";
    const flash = document.getElementById("dmg-flash");
    flash.style.opacity = "0.5";
    setTimeout(() => flash.style.opacity = "0", 100);
}

// ==========================================
// 6. MAIN GAME LOOP
// ==========================================
function animate() {
    requestAnimationFrame(animate);
    if(state.hp <= 0) { alert("YOU DIED. The Karma resets."); location.reload(); return; }

    // Hero Movement
    const spd = state.isDashing ? 0.8 : 0.25;
    hero.position.x += state.moveX * spd;
    hero.position.z += state.moveZ * spd;

    // Anime Boss Logic
    if (boss) {
        // Rotate Auras
        auras.forEach(a => {
            a.mesh.rotation.x += a.speed;
            a.mesh.rotation.y += a.speed;
        });

        const dir = new THREE.Vector3().subVectors(hero.position, boss.position).normalize();
        boss.position.addScaledVector(dir, 0.05 + (state.level*0.005));
        boss.lookAt(hero.position);

        // Anime Projectile Attack System
        boss.userData.timer++;
        if (boss.userData.timer > boss.userData.cfg.atkRate) {
            // Shoot Energy Orb
            const orb = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshBasicMaterial({color: boss.userData.cfg.aura}));
            orb.position.copy(boss.position);
            orb.position.y += 3;
            // Astraeus shoots spread!
            const shootDir = new THREE.Vector3().copy(dir);
            if(state.level === 10) shootDir.x += (Math.random() - 0.5) * 0.5; 
            
            orb.userData = { dir: shootDir, spd: boss.userData.cfg.projSpeed, life: 200 };
            scene.add(orb);
            projectiles.push(orb);
            
            boss.userData.timer = 0;
        }

        // Death Check
        if (boss.userData.hp <= 0) {
            state.karma++;
            if(state.level >= 10) { alert("GOD ASTRAEUS DEFEATED! YOU WIN!"); location.reload(); return; }
            buildLevel(state.level + 1);
            hero.position.set(0, 1.2, 0);
            state.hp = 100; document.getElementById("bar-hp").style.width = "100%";
        }
    }

    // Update Projectiles
    projectiles.forEach((p, i) => {
        p.position.addScaledVector(p.userData.dir, p.userData.spd);
        p.userData.life--;
        if(hero.position.distanceTo(p.position) < 2.5) { takeDamage(15); p.userData.life = 0; }
        if(p.userData.life <= 0) { scene.remove(p); projectiles.splice(i, 1); }
    });

    // Update Minions
    enemies.forEach((en, i) => {
        if(en.userData.hp <= 0) { scene.remove(en); enemies.splice(i, 1); return; }
        en.position.addScaledVector(new THREE.Vector3().subVectors(hero.position, en.position).normalize(), en.userData.spd);
        if(hero.position.distanceTo(en.position) < 2) takeDamage(0.3);
    });

    // 3rd Person Action Camera (Lower and Closer)
    const camTarget = new THREE.Vector3(hero.position.x, 10, hero.position.z + 18);
    camera.position.lerp(camTarget, 0.1);
    camera.lookAt(hero.position);

    renderer.render(scene, camera);
}

// Handle Screen Rotation / Resize safely
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
